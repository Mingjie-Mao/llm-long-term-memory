# Render blueprint for the public playground backend.
#
# This deploys `demo-api/` only — the LLM-free half of the memory engine. It calls no
# model provider, so it needs no API key and cannot spend the experiment's quota.
#
# **The free instance sleeps.** Render's free plan stops a service after roughly 15
# minutes without traffic, and the next request pays a cold start: the process boots
# and loads an 87MB ONNX model. The playground page is built for that — it shows a
# "waking the backend" state rather than appearing broken — but it is the reason a
# first visit can take tens of seconds, and it is a property of the plan, not a bug.
#
# **Memory.** The free instance gives 512MB. The torch path needs roughly 565MB of
# wheels before a single request; onnxruntime plus the model is about 162MB, which is
# why `demo-api/requirements.txt` exists separately from `pyproject.toml` and pulls no
# PyTorch.
#
# **Disk is ephemeral.** Free services have no persistent volume, so the demo SQLite
# file starts empty after every restart. That is the correct behaviour here: sessions
# are throwaway by design and are hard-deleted after an hour anyway.

services:
  - type: web
    name: lltm-playground
    runtime: python
    plan: free
    region: oregon
    branch: main
    # Build fetches the encoder from HuggingFace and refuses to continue unless it
    # reproduces the reference embeddings committed alongside it. A build that
    # downloads a model and starts serving is trusting a URL.
    buildCommand: |
      pip install --no-cache-dir -r demo-api/requirements.txt
      python demo-api/fetch_encoder.py
    startCommand: uvicorn app:app --app-dir demo-api --host 0.0.0.0 --port $PORT
    healthCheckPath: /demo/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Signs the session tokens that stand in for the accounts this demo does not
      # have. Generated by Render, never in the repository, and rotating it simply
      # invalidates sessions that were going to expire within the hour regardless.
      - key: LLTM_DEMO_SECRET
        generateValue: true
      # Disk is ephemeral on the free plan; /tmp is the honest place for a store whose
      # contents are deleted after an hour by design.
      - key: LLTM_DEMO_STORE
        value: /tmp/demo-playground
      # Browser callers. Narrow rather than "*", so the token this service issues is
      # only usable from the pages that are meant to use it.
      - key: LLTM_DEMO_ORIGINS
        value: https://lltm-memory.pages.dev,http://localhost:8779,http://127.0.0.1:8779
