<text x="40" y="933" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#586775" text-anchor="start">A need_source verdict can still choose archive-wide recovery if the best BM25 hit is outside local source sessions.</text>
<text x="40" y="956" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#586775" text-anchor="start">Reranking, session-coherent context, packing, decay and adaptive hydration are optional branches; see the atlas captions.</text>
<text x="40" y="979" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#586775" text-anchor="start">Limits shown are from the checked-in default configurations. A malformed first verdict has a separate parse-failure return.</text>
