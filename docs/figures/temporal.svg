<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Rebuild a fact timeline independently of arrival order</title>
<desc id="desc">Architecture verified against the repository on 2026-09-07. See docs/ARCHITECTURE.md for the detailed figure caption and source mapping. Solid arrows show flow; dashed arrows show conditional paths.</desc>
<rect x="0" y="0" width="1200" height="770" rx="7" fill="#FFFFFF" stroke="none" stroke-width="1.3"/>
<text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#345E80" text-anchor="start">FIGURE 05</text>
<text x="40" y="82" font-family="Georgia, Times New Roman, serif" font-size="31" font-weight="400" fill="#203247" text-anchor="start">Rebuild a fact timeline independently of arrival order</text>
<text x="40" y="113" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#586775" text-anchor="start">Illustrative replacement chain on one (user_id, subject, predicate) key; each successor explicitly replaces the prior value.</text>
<polyline points="40,133 1160,133" fill="none" stroke="#CED6DC" stroke-width="1" stroke-linejoin="round"/>
<text x="40" y="175" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#586775" text-anchor="start">A. INGESTION ORDER  /  THE ORDER IN WHICH THE SYSTEM LEARNS</text>
<rect x="40" y="199" width="245" height="89" rx="7" fill="#EEF4F8" stroke="#345E80" stroke-width="1.3"/>
<text x="56" y="228" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#345E80" text-anchor="start">Arrives first</text>
<text x="56" y="256" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#203247" text-anchor="start">August: Sydney</text>
<rect x="330" y="199" width="245" height="89" rx="7" fill="#EEF4F8" stroke="#345E80" stroke-width="1.3"/>
<text x="346" y="228" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#345E80" text-anchor="start">Arrives second</text>
<text x="346" y="256" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#203247" text-anchor="start">January: Canberra</text>
<rect x="620" y="199" width="245" height="89" rx="7" fill="#EEF4F8" stroke="#345E80" stroke-width="1.3"/>
<text x="636" y="228" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#345E80" text-anchor="start">Arrives third</text>
<text x="636" y="256" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#203247" text-anchor="start">March: Melbourne</text>
<polyline points="285,244 330,244" fill="none" stroke="#8795A1" stroke-width="1.7" stroke-linejoin="round"/>
<polygon points="330,244 322.0,240.3 322.0,247.7" fill="#8795A1"/>
<polyline points="575,244 620,244" fill="none" stroke="#8795A1" stroke-width="1.7" stroke-linejoin="round"/>
<polygon points="620,244 612.0,240.3 612.0,247.7" fill="#8795A1"/>
<rect x="910" y="199" width="250" height="89" rx="7" fill="#EFF6F3" stroke="#32766D" stroke-width="1.3"/>
<text x="926" y="228" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#32766D" text-anchor="start">Resolve the full key</text>
<text x="926" y="256" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#203247" text-anchor="start">Sort by event_time, then ID</text>
<polyline points="865,244 910,244" fill="none" stroke="#8795A1" stroke-width="1.7" stroke-linejoin="round"/>
<polygon points="910,244 902.0,240.3 902.0,247.7" fill="#8795A1"/>
<text x="40" y="350" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#586775" text-anchor="start">B. VALIDITY ORDER  /  HALF-OPEN INTERVALS [START, END)</text>
<text x="355" y="391" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#586775" text-anchor="middle">Jan 01</text>
<polyline points="355,407 355,588" fill="none" stroke="#CED6DC" stroke-width="1" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="540" y="391" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#586775" text-anchor="middle">Mar 01</text>
<polyline points="540,407 540,588" fill="none" stroke="#CED6DC" stroke-width="1" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="900" y="391" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#586775" text-anchor="middle">Aug 01</text>
<polyline points="900,407 900,588" fill="none" stroke="#CED6DC" stroke-width="1" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="61" y="440" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#203247" text-anchor="start">Canberra</text>
<rect x="355" y="418" width="185" height="38" rx="3" fill="#EEF4F8" stroke="#345E80" stroke-width="1.3"/>
<text x="448" y="444" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#345E80" text-anchor="middle">superseded</text>
<text x="61" y="507" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#203247" text-anchor="start">Melbourne</text>
<rect x="540" y="485" width="360" height="38" rx="3" fill="#EEF4F8" stroke="#345E80" stroke-width="1.3"/>
<text x="720" y="511" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#345E80" text-anchor="middle">superseded</text>
<text x="61" y="574" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#203247" text-anchor="start">Sydney</text>
<rect x="900" y="552" width="215" height="38" rx="3" fill="#EFF6F3" stroke="#32766D" stroke-width="1.3"/>
<text x="993" y="578" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#32766D" text-anchor="middle">active</text>
<polyline points="1080,571 1140,571" fill="none" stroke="#32766D" stroke-width="1.7" stroke-linejoin="round"/>
<polygon points="1140,571 1132.0,567.3 1132.0,574.7" fill="#32766D"/>
<text x="61" y="619" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#203247" text-anchor="start">Late March evidence moves Canberra&#x27;s valid_to from August back to March; the August fact stays current.</text>
<polyline points="40,670 1160,670" fill="none" stroke="#CED6DC" stroke-width="1" stroke-linejoin="round"/>
<text x="40" y="693" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#586775" text-anchor="start">Coexisting successors do not close the previous fact. Repeated values may fold into the earliest interval owner.</text>
<text x="40" y="716" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#586775" text-anchor="start">Undated facts are left unresolved. event_time currently comes from the session date; ingested_at records arrival time.</text>
<text x="40" y="739" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#586775" text-anchor="start">This is an explanatory example, not a benchmark result or a claim of full transaction-time history.</text>
</svg>
