[project]
name = "llm-long-term-memory"
version = "0.1.0"
description = "An adaptive long-term memory engine for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pyyaml>=6.0",
    # Windows ships no system time zone database, so `zoneinfo` cannot resolve
    # "America/Los_Angeles" and importing the rate limiter fails outright. The zone
    # is not decorative: the provider resets its daily quota at Pacific midnight,
    # which is what the limiter counts against. Caught by the Windows CI job.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Pulls torch (~2GB). Needed from P1 onward; skip it for dataset/stats work.
embed = ["sentence-transformers>=3.0"]
# Added in P2, when the extraction pipeline needs an API key.
llm = ["google-genai>=1.0"]
# P7. The HTTP service. Kept optional so the CLI and the test suite do not depend
# on a web framework.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# A3. Cross-encoder reranking, measured and *not* enabled by default: it changed no
# answers and lowered source recall (results/rerank-pareto.md). Its own extra so
# that running the product never pulls a reranker model nobody asked for. The
# `embed` extra already provides sentence-transformers; this exists to make the
# dependency intentional rather than incidental.
rerank = ["sentence-transformers>=3.0"]
# P9. The MCP server. Optional so that a REST-only deployment does not carry a
# protocol implementation it never speaks.
mcp = ["mcp>=1.2"]

[project.scripts]
# Two entry points for one app: the full name matches the package, `lltm` is what
# you actually type. Both dispatch to the same Typer app.
llm-long-term-memory = "llm_long_term_memory.cli:app"
lltm = "llm_long_term_memory.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_long_term_memory"]

[tool.hatch.build.targets.wheel.force-include]
"src/llm_long_term_memory/api/static" = "llm_long_term_memory/api/static"

[tool.ruff]
line-length = 100
target-version = "py311"
# Archived verifiers are evidence, not source. Every `conclusion.json` records the
# byte length and sha256 of the verifier that produced its verdict, and the verifier
# checks that inventory — including its own entry. A formatter that rewrote one would
# silently invalidate the archive it exists to prove, and the failure would surface as
# an unrelated "evidence changed" error in whatever ran next. Excluding them is not a
# style exemption: these files are finished and must never be edited again, so there is
# nothing for either the linter or the formatter to act on.
extend-exclude = ["tools/verify_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids function calls in argument defaults, which is exactly how FastAPI
# declares dependencies and query parameters. The rule is right in general and
# wrong here; exempting the three callables is narrower than switching B008 off.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Any file opened in text mode without an explicit `encoding=` fails the suite.
# On POSIX the locale codec is UTF-8, so such a defect is invisible until it
# reaches a Windows machine and corrupts an evaluation artifact. This turns
# platform luck into a test failure that names the exact call site.
#
# EncodingWarning is only emitted when the interpreter is started with
# `PYTHONWARNDEFAULTENCODING=1` (CI sets it) or `python -X warn_default_encoding`.
# To reproduce locally:
#   PYTHONWARNDEFAULTENCODING=1 uv run pytest
filterwarnings = ["error::EncodingWarning"]
