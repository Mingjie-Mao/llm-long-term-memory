# The gate that was missing when the first deploy failed.
#
# `render.yaml` sets `autoDeploy: true`, so a push to main builds and ships without
# anything in between. The first one failed a minute into the build on an import the
# development checkout could satisfy and the deployment could not — `smoke.py` had
# passed all 27 of its assertions against an environment that did not exist on the
# target.
#
# So this runs the two checks that would have caught it, on every change that touches
# the service. It deliberately does not use `uv sync`: the point is to exercise the
# exact dependency lock `demo-api/requirements.txt` declares, not the one a developer has.
name: public-demo

on:
  push:
    branches: [main]
    paths:
      - "demo-api/**"
      - "public-demo/**"
      - "render.yaml"
      - ".github/workflows/demo-api.yml"
      # The service imports the engine from source, so an engine change can break it
      # even when nothing under demo-api/ moved.
      - "src/llm_long_term_memory/**"
  pull_request:
    paths:
      - "demo-api/**"
      - "public-demo/**"
      - "render.yaml"
      - ".github/workflows/demo-api.yml"
      - "src/llm_long_term_memory/**"

jobs:
  static-site:
    name: static site structure and accessibility contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Check deploy surface, labels, translations, and release manifest
        run: uv run --no-project python public-demo/check_site.py
      - name: Check accidental upload regressions
        run: uv run --no-project python -m unittest discover -s public-demo -p 'test_*.py'

  deploy-environment:
    name: imports under the declared dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12

      # Reproduces what Render does: install only what requirements.txt names, then
      # import the app. A failure here is the build failure, found before the build.
      - name: Import in a clean environment
        run: uv run --no-project --with uv python demo-api/check_imports.py

      - name: Blueprint parses
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import yaml
          spec = yaml.safe_load(open("render.yaml", encoding="utf-8"))
          # Select by name. This used to unpack a single service, which was true when
          # there was one and became a build failure the moment a second was configured.
          by_name = {service["name"]: service for service in spec["services"]}

          playground = by_name["lltm-playground"]
          for key in ("plan", "buildCommand", "startCommand", "healthCheckPath"):
              assert playground.get(key), f"lltm-playground is missing {key}"
          assert playground["plan"] == "free", "the playground left the free plan"
          # The build must fetch and verify the encoder. Without this step a deploy
          # starts with no model and fails at the first search instead of at build.
          assert "fetch_encoder.py" in playground["buildCommand"], \
              "the build no longer verifies the encoder"

          # The memory service holds user data, so three properties are not optional.
          memory = by_name["lltm-memory"]
          assert memory.get("disk"), "the memory service lost its disk; it would forget on restart"
          assert memory.get("autoDeploy") is False, \
              "the memory service must not restart because somebody pushed"
          env = {item["key"]: item for item in memory["envVars"]}
          assert env["LLTM_REQUIRE_AUTH"]["value"] == "1", "fail-closed auth was turned off"
          for secret in ("LLTM_API_TOKENS", "GEMINI_API_KEY"):
              assert env[secret].get("sync") is False, \
                  f"{secret} must be set in the dashboard, never synced from the repository"

          print(f"render.yaml OK: {', '.join(sorted(by_name))}")
          PY

  behaviour:
    name: supersession, rejection reasons, isolation, hard delete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12

      - name: Create the runtime environment
        run: |
          uv venv .demo-venv --python 3.12
          uv pip install --python .demo-venv/bin/python -r demo-api/requirements.txt

      # The 87MB model is not in the repository. Fetching it here also means the
      # agreement check against reference_embeddings.json runs on every change: if
      # HuggingFace ever serves a different export, CI says so rather than the demo
      # quietly returning different vectors.
      - name: Fetch and verify the encoder
        run: .demo-venv/bin/python demo-api/fetch_encoder.py

      - name: Smoke test
        run: .demo-venv/bin/python demo-api/smoke.py
