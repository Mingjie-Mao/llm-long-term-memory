# The gate that was missing when the first deploy failed.
#
# `render.yaml` sets `autoDeploy: true`, so a push to main builds and ships without
# anything in between. The first one failed a minute into the build on an import the
# development checkout could satisfy and the deployment could not — `smoke.py` had
# passed all 27 of its assertions against an environment that did not exist on the
# target.
#
# So this runs the two checks that would have caught it, on every change that touches
# the service. It deliberately does not use `uv sync`: the point is to exercise the
# dependency set `demo-api/requirements.txt` declares, not the one a developer has.
name: demo-api

on:
  push:
    branches: [main]
    paths:
      - "demo-api/**"
      - "render.yaml"
      - ".github/workflows/demo-api.yml"
      # The service imports the engine from source, so an engine change can break it
      # even when nothing under demo-api/ moved.
      - "src/llm_long_term_memory/**"
  pull_request:
    paths:
      - "demo-api/**"
      - "render.yaml"
      - ".github/workflows/demo-api.yml"
      - "src/llm_long_term_memory/**"

jobs:
  deploy-environment:
    name: imports under the declared dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12

      # Reproduces what Render does: install only what requirements.txt names, then
      # import the app. A failure here is the build failure, found before the build.
      - name: Import in a clean environment
        run: uv run --no-project --with uv python demo-api/check_imports.py

      - name: Blueprint parses
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import yaml, sys
          spec = yaml.safe_load(open("render.yaml"))
          service, = spec["services"]
          for key in ("name", "plan", "buildCommand", "startCommand", "healthCheckPath"):
              assert service.get(key), f"render.yaml is missing {key}"
          assert service["plan"] == "free", "the blueprint left the free plan"
          # The build must fetch and verify the encoder. Without this step a deploy
          # starts with no model and fails at the first search instead of at build.
          assert "fetch_encoder.py" in service["buildCommand"], \
              "the build no longer verifies the encoder"
          print(f"render.yaml OK: {service['name']} / {service['plan']}")
          PY

  behaviour:
    name: supersession, rejection reasons, isolation, hard delete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12

      - name: Create the runtime environment
        run: |
          uv venv .demo-venv --python 3.12
          uv pip install --python .demo-venv/bin/python -r demo-api/requirements.txt

      # The 87MB model is not in the repository. Fetching it here also means the
      # agreement check against reference_embeddings.json runs on every change: if
      # HuggingFace ever serves a different export, CI says so rather than the demo
      # quietly returning different vectors.
      - name: Fetch and verify the encoder
        run: .demo-venv/bin/python demo-api/fetch_encoder.py

      - name: Smoke test
        run: .demo-venv/bin/python demo-api/smoke.py
