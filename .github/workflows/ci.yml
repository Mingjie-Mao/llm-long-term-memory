name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint once. Style is platform-independent, so running ruff three times would
  # only buy three copies of the same answer.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: Install
        run: uv sync --group dev --extra llm
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Force the legacy locale codec on Windows (cp1252 on the runner) instead of
      # letting Python's UTF-8 mode paper over the defect this matrix exists to
      # catch. Without this the Windows job would pass even if a file I/O site
      # dropped its `encoding=`, because the runner's UTF-8 mode would supply the
      # right codec by accident. Harmless on POSIX, where UTF-8 is already the
      # locale default.
      PYTHONUTF8: "0"
      # Emit EncodingWarning wherever text-mode I/O relies on the locale codec.
      # pyproject turns that warning into an error, so this catches a missing
      # `encoding=` on *every* platform rather than only where the locale differs
      # — the Windows job proves the behaviour, this makes all three jobs enforce
      # it.
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      # `llm` is required: the tests exercise real provider quirks (a 429 quota
      # body, a generic 400 on thinking_budget) and construct the SDK's own error
      # and config types to do it. `api` and `mcp` are here because without them
      # the service and protocol tests skip, and a matrix that silently skips two
      # thirds of the suite reports platform support it never checked — 101 tests
      # ran where 354 exist. Neither extra pulls torch.
      #
      # `embed` stays out: ~2GB of torch, and `Encoder` loads sentence-transformers
      # lazily inside a property, so nothing imported at collection time needs it.
      - name: Install
        run: uv sync --group dev --extra llm --extra api --extra mcp

      - name: Test
        run: uv run pytest --cov=llm_long_term_memory --cov-report=term-missing

      # The public page renders its figures from `release.json` rather than from
      # hard-coded HTML, and `check_site.py` enforces that. But that only moved the
      # drift: nothing checked whether the manifest's own numbers were still true, so
      # `tests: 560` was as hand-maintained as the HTML string had been. This runs
      # here because this is the job that knows the answer, and only on one platform
      # because the count does not vary by OS.
      - name: Release figures match what was measured
        if: matrix.os == 'ubuntu-latest'
        run: uv run python public-demo/check_release_figures.py
