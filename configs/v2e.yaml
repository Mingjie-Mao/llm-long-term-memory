# v2e reads a backfilled copy of the v2c store. It does not change ingestion.
# Query-time changes are deterministic: suppress older related values behind an
# explicit replacement, assemble chronological evidence for sequence questions,
# and hydrate source text when a question requests finer date precision than the
# structured fact retained.
name: v2e
description: v2c with date provenance — an undated fact stops claiming the day it was mentioned
models:
  extractor: gemini-3.1-flash-lite
  answerer: gemini-3.5-flash-lite
  judge: gemma-4-31b-it
  embedder: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384
quota:
  rpm: 10
  tpm: 250000
  rpd: 500
  max_wait_seconds: 300.0
retrieval:
  weights:
    semantic: 1.0
    bm25: 0.0
    recency: 0.0
    importance: 0.0
    entity: 0.0
  candidate_limit: 50
  top_k: 20
  recency_halflife_days: 30.0
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 50
    batch_size: 32
hydration:
  neighbouring_sentences: 1
  max_tokens: 800
  allocation: ranked
fallback:
  enabled: true
  max_turns: 3
  max_chars: 2400
temporal_resolution: true
dataset_variant: s
dataset_limit: 50
