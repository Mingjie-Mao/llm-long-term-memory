# v2b — v2 with one parameter changed: eight sessions per extraction request, not
# fifteen.
#
# Fifteen was never a quality decision. It was set by the free tier's 500 requests
# per day, and it costs 27.6 points of extraction fidelity: 37.3% at 15 against
# 64.9% at 8, on the same sixty held-out sessions under the same ruler, prompts and
# model. The full curve and the archived extractions behind it are in
# results/batch-size-result.md and results/analysis/extraction-batch-size.json.
#
# Eight rather than one. Fidelity keeps rising below 8 — 66.4% at 5, 70.9% at 3,
# 78.4% at 1 — but 15 → 8 buys two thirds of the whole available gain for one extra
# quota day, and 8 → 1 buys the remaining 13.5 points for eight more. The knee is
# the operating point; the maximum is not.
#
# **This is a separate ingestion version, not a retune of v2.** The pipeline
# fingerprints `sessions_per_request`, so resuming a v2 store under this config
# raises ExtractorChanged rather than quietly writing batch-8 memories into a
# batch-15 store. Use a new --store-name. The v2 results stay as they are; nothing
# measured under batch 15 is restated under batch 8, and no old store is rebuilt.
#
# Not yet run at scale: adopting it means ~3 quota days on dev100 against ~2 at
# batch 15, and the fidelity gain is measured while its effect on answer accuracy
# is not. results/prereg-batch-size.md registers that experiment and its decision
# rule, which this config does not pre-empt.
name: v2b-batch8
description: v2, with extraction batched 8 sessions per request instead of 15
models:
  extractor: gemini-3.1-flash-lite
  answerer: gemini-3.5-flash-lite
  judge: gemma-4-31b-it
  embedder: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384
quota:
  rpm: 10
  tpm: 250000
  rpd: 500
  max_wait_seconds: 300.0
ingest:
  sessions_per_request: 8
  dedupe_sessions: true
  dedupe_similarity_threshold: 0.92
  two_stage: true
  checkpoint_every: 5
retrieval:
  weights:
    semantic: 1.0
    bm25: 0.0
    recency: 0.0
    importance: 0.0
    entity: 0.0
  candidate_limit: 50
  top_k: 20
  recency_halflife_days: 30.0
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 50
    batch_size: 32
pack:
  enabled: false
  token_budget: 2000
  utility_model_path: null
  type_floors:
    profile: 0.1
    semantic: 0.3
decay:
  enabled: false
  halflife_days: 60.0
  reinforcement: 0.3
  max_memories_per_user: 0
consolidation_config:
  similarity_threshold: 0.84
  min_cluster_size: 3
  source_strength_multiplier: 0.5
hydration:
  neighbouring_sentences: 1
  max_tokens: 800
fallback:
  enabled: true
  max_turns: 3
  max_chars: 2400
context:
  max_sessions: 3
  window_radius: 1
  max_total_memories: 30
  aggregate: mean
  session_order: chronological
  include_superseded: false
service:
  top_k: 10
temporal_resolution: true
consolidation: false
dataset_variant: s
dataset_limit: 50
