# v5.0 reads the same completed v2b batch-8 store as v2c and does not change ingestion.
#
# Everything v2c does is kept: update suppression, chronological assembly, and the
# detail trigger. The one difference is that verbatim turns from the sessions retrieval
# already selected are attached before the first answer call, rather than after the
# answerer says it cannot answer.
#
# The offline gate (results/analysis/v5-offline-gate.md) is why: three of v2c's eleven
# failures on reasoning-48 were a sentence the extractor had dropped from a session
# that retrieval had found, and in thirty-eight of forty-eight questions no raw turn
# reached the reader at all. `fallback.enabled` stays true so the conditional path
# remains available for what source-local windows do not cover.
name: v5
description: v2c plus verbatim source-local turns attached before the first answer call
models:
  extractor: gemini-3.1-flash-lite
  answerer: gemini-3.5-flash-lite
  judge: gemma-4-31b-it
  embedder: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384
quota:
  rpm: 10
  tpm: 250000
  rpd: 500
  max_wait_seconds: 300.0
retrieval:
  weights:
    semantic: 1.0
    bm25: 0.0
    recency: 0.0
    importance: 0.0
    entity: 0.0
  candidate_limit: 50
  top_k: 20
  recency_halflife_days: 30.0
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 50
    batch_size: 32
hydration:
  neighbouring_sentences: 1
  max_tokens: 800
  allocation: ranked
fallback:
  enabled: true
  max_turns: 3
  max_chars: 2400
temporal_resolution: true
dataset_variant: s
dataset_limit: 50
