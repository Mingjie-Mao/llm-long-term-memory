name: v3-phase4-adaptive
description: v3.2 reasoning with source hydration only for multi-step question kinds

dataset_variant: s
dataset_limit: 150

models:
  extractor: gemini-3.1-flash-lite
  answerer: gemini-3.5-flash-lite
  judge: gemma-4-31b-it
  embedder: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384

ingest:
  sessions_per_request: 15
  two_stage: true
  checkpoint_every: 5
  dedupe_sessions: true
  dedupe_similarity_threshold: 0.92

retrieval:
  candidate_limit: 50
  top_k: 20
  weights:
    semantic: 1.0
    bm25: 0.0
    entity: 0.0
    recency: 0.0
    importance: 0.0
  recency_halflife_days: 30
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 50
    batch_size: 32

context:
  max_sessions: 3
  window_radius: 1
  aggregate: mean
  session_order: chronological
  max_total_memories: 30
  include_superseded: false

hydration:
  neighbouring_sentences: 1
  max_tokens: 800

fallback:
  enabled: true
  max_turns: 3
  max_chars: 2400

temporal_resolution: true
consolidation: false

consolidation_config:
  similarity_threshold: 0.84
  min_cluster_size: 3
  source_strength_multiplier: 0.5

pack:
  enabled: false
  token_budget: 2000
  type_floors:
    semantic: 0.3
    profile: 0.1
  utility_model_path: null

decay:
  enabled: false
  halflife_days: 60
  max_memories_per_user: 0
  reinforcement: 0.3

quota:
  rpm: 10
  rpd: 500
  tpm: 250000
  max_wait_seconds: 300

service:
  top_k: 10
